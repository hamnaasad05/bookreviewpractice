services:
  postgresdb:
    image: postgres:16
    ports: 
      - "5432:5432"
    shm_size: 128mb
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgresdb
    env_file: 
      - .env
    ports:
      - "8000:8000"


volumes:
  pgdata: